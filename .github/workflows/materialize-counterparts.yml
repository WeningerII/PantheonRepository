name: Materialize verified counterpart artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-counterparts.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tradition-counterpart-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Reproduce locally verified source and build hashes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if test "$(git hash-object app/data.js)" = "085297b9ea5f8817aaecb7e55b81d61dd5ce1f7a" && test "$(git hash-object dist/pantheon-registry.html)" = "63e4ce02579e19af94604b82f4a4e8b51de18f15"; then exit 0; fi
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('app/data.js')
          s = p.read_text()
          old = "alt: ['Cypris', 'Cytherea', 'Pandemos', 'Urania']"
          new = "alt: ['Cypris', 'Cytherea', 'Pandemos', 'Aphrodite Urania']"
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '  (m) => applyIconography(m, ICONO_SWEEP),'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n  (m) => applyRelationshipSupplement(m, RELATIONSHIP_SWEEP),')
          p.write_text(s)
          PYCODE
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          test "$(git hash-object app/data.js)" = "085297b9ea5f8817aaecb7e55b81d61dd5ce1f7a"
          test "$(git hash-object dist/pantheon-registry.html)" = "63e4ce02579e19af94604b82f4a4e8b51de18f15"
          git add -- app/data.js dist/pantheon-registry.html
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize verified counterpart corpus and standalone artifact"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/fix/tradition-counterpart-coverage | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/tradition-counterpart-coverage
