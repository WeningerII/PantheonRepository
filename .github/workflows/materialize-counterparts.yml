name: Materialize verified counterpart artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-counterparts.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/counterpart-navigation-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Reproduce locally verified source and build hashes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if test "$(git hash-object app/data.js)" = "a316eb17b70bbd02f9a933b25033aefa4d0eb424" && test "$(git hash-object dist/pantheon-registry.html)" = "2b01aad3e53b755544b6b5bc1c8c2dd8b6cf8f54"; then exit 0; fi
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-counterparts.cjs
          test "$(git hash-object app/data.js)" = "a316eb17b70bbd02f9a933b25033aefa4d0eb424"
          test "$(git hash-object dist/pantheon-registry.html)" = "2b01aad3e53b755544b6b5bc1c8c2dd8b6cf8f54"
          test "$(git hash-object data-sources/audits/connected-counterparts/ledger.json)" = "498b3f2328e344b36747ae418ff393c0a7dea463"
          git add -- app/data.js dist/pantheon-registry.html data-sources/audits/connected-counterparts/ledger.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize verified counterpart corpus and standalone artifact"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/feat/counterpart-navigation-accounts | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/counterpart-navigation-accounts
