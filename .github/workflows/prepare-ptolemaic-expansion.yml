name: Prepare reviewed Ptolemaic expansion
on:
  push:
    branches: [codex/ptolemaic-thais-artakama]
permissions:
  contents: write
concurrency:
  group: prepare-ptolemaic-expansion
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare reviewed Ptolemaic expansion artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Recreate reviewed artifacts and verify the complete tree
        env:
          EXPECTED_TREE: c5ee6b5852eb95f779b85fd56b9ec691db39eea1
        run: |
          set -euo pipefail
          git apply --check .github/ptolemaic-metadata.patch
          git apply .github/ptolemaic-metadata.patch
          node scripts/validate-transcripts.cjs data-sources/transcripts/ptolemaic-thais.txt data-sources/transcripts/ptolemaic-artakama.txt
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          node scripts/audit-counterparts.cjs
          python3 build.py
          rm .github/ptolemaic-metadata.patch .github/workflows/prepare-ptolemaic-expansion.yml
          git add -A
          actual_tree=$(git write-tree)
          if [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "Reviewed tree mismatch: expected $EXPECTED_TREE; got $actual_tree"
            git diff --cached --stat
            exit 1
          fi
          echo "Verified reviewed tree $actual_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate reviewed Ptolemaic artifacts and remove preparation workflow'
          git push origin HEAD:codex/ptolemaic-thais-artakama
