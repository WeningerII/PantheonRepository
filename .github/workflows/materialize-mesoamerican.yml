name: Materialize verified Mesoamerican artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-mesoamerican.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'enrichment/quetzalcoatl-network'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Reproduce exact local artifact hashes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-mesoamerican-counterparts.cjs
          test "$(git hash-object app/data.js)" = "3a72bb39e8784cd35294bbf9ffb3d42c521db468"
          test "$(git hash-object dist/pantheon-registry.html)" = "ddbd62f8622da8f3d09ccf5708e70e037701d299"
          test "$(git hash-object data-sources/audits/mesoamerican-counterparts/ledger.json)" = "30d18b4d226a7b8cffd1720624ca97c9a2f76233"
          git add -- app/data.js dist/pantheon-registry.html data-sources/audits/mesoamerican-counterparts/ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while read -r p; do
            case "$p" in app/data.js|dist/pantheon-registry.html|data-sources/audits/mesoamerican-counterparts/ledger.json) ;; *) exit 1 ;; esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize exact verified Mesoamerican artifacts'
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/enrichment/quetzalcoatl-network | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/enrichment/quetzalcoatl-network
