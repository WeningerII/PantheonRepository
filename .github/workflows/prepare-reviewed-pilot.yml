name: Prepare reviewed pilot
on:
  push:
    branches:
      - codex/ptolemaic-founder-pilot
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'WeningerII/PantheonRepository' && github.ref == 'refs/heads/codex/ptolemaic-founder-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce the reviewed generated files
        run: |
          npm ci --no-audit --no-fund
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-counterparts.cjs
      - name: Verify exact reviewed tree and publish only this branch
        env:
          EXPECTED_TREE: 6ba8e611ee27ab2dbe677a52a5bf01ac35d410b5
        run: |
          git rm .github/workflows/prepare-reviewed-pilot.yml
          git add app/data.js dist/pantheon-registry.html data-sources/audits/connected-counterparts/ledger.json
          actual_tree=$(git write-tree)
          if [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "Generated tree differs from the reviewed local tree; refusing to push."
            git diff --cached --stat
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reproduce the reviewed Ptolemaic pilot and remove temporary preparation workflow"
          git push origin HEAD:refs/heads/codex/ptolemaic-founder-pilot
