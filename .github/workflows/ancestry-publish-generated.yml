name: Prepare reviewed ancestry artifacts
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ptolemaic-complete-ancestry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Regenerate the reviewed source changes
        run: |
          set -euo pipefail
          if ! git apply --reverse --check .github/ancestry-formatter.patch 2>/dev/null; then
            git apply .github/ancestry-formatter.patch
          fi
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          git add app/data.js dist/pantheon-registry.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate reviewed ancestry corpus and standalone artifact'
          git push origin HEAD:refs/heads/fix/ptolemaic-complete-ancestry
