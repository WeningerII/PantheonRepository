name: Regenerate standalone artifact for PR 139
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/repair-standalone-artifact.yml']
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event.pull_request.number == 139 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/structural-lineage-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Build and commit the generated artifact
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 build.py
          test "$(git hash-object dist/pantheon-registry.html)" = "978a1af812aa250cd479c3f2e04baee7aab8efcd"
          git add -- dist/pantheon-registry.html
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "dist/pantheon-registry.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate standalone artifact for lineage changes"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/fix/structural-lineage-template | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/structural-lineage-template
