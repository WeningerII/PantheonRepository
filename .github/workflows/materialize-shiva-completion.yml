name: Materialize verified artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-shiva-completion.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/shiva-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Reproduce and verify exact artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-shiva-counterparts.cjs
          node scripts/audit-sakra-indra.cjs
          test "$(git hash-object app/data.js)" = "51eb985c0d50892834ee6f3820013ba6c234f458"
          test "$(git hash-object dist/pantheon-registry.html)" = "de5871f06738317af84f805ee1f703e906915924"
          test "$(git hash-object data-sources/audits/shiva-counterparts/ledger.json)" = "ce455406585d0db013ffa18c5d4e21cc258b5f14"
          test "$(git hash-object data-sources/audits/sakra-indra/ledger.json)" = "e20602332403f80677e77abacfb9413364368d13"
          git add -- app/data.js dist/pantheon-registry.html data-sources/audits/shiva-counterparts/ledger.json data-sources/audits/sakra-indra/ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize hash-verified artifacts"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/codex/shiva-completion | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/codex/shiva-completion
