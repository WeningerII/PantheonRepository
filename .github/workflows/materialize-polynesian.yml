name: Materialize verified Polynesian artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-polynesian.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/polynesian-counterpart-network'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Regenerate and verify exact authored output
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-polynesian-counterparts.cjs
          test "$(git hash-object app/data.js)" = "b6506cd054dee9875fbadc6789c1b9576efa0ade"
          test "$(git hash-object dist/pantheon-registry.html)" = "0dbc8797182cee065dc6a55287ce084f16de2091"
          test "$(git hash-object data-sources/audits/polynesian-counterparts/ledger.json)" = "2c96588f1c175b98bddb9334cd3c545bd6b968a7"
          git add -- app/data.js dist/pantheon-registry.html data-sources/audits/polynesian-counterparts/ledger.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize verified Polynesian corpus and audit artifacts"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/feat/polynesian-counterpart-network | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/polynesian-counterpart-network
