name: Ingest Commons images

# Fetch PD / PD-old / PD-art / CC0 figure portraits from Wikimedia Commons
# (docs/image-licensing.md — the owner-set HARD RULE) and commit the optimized,
# self-hosted results. This lives in CI, not the build, because Wikimedia is
# unreachable from the build sandbox and because ingest needs network + sharp.
# The running site only ever reads the committed, license-verified output.
#
# The tiered design and every mode are documented in docs/image-pipeline.md.
# Ways this fires:
#
#   • Push data-sources/image-run.json     → runs the mode named inside it
#     (usually {"mode":"delta"} — the capped incremental sweep). Bump any
#     field to re-trigger the next batch.
#   • Push data-sources/image-approved.json → ingests the owner's contact-
#     sheet approvals (license gate re-runs on every file).
#   • Push data-sources/image-request.json  → `auto` for the listed figure ids
#     (Tier-A auto-ship when curated data allows; review queue otherwise).
#   • Monthly cron                          → `check` (license-drift audit)
#     then `delta`; scan-state TTLs make this the quarterly map refresh and
#     yearly no-image re-scan automatically.
#   • Manual dispatch                       → any mode, from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [delta, map, harvest, fallback, sheet, approved, auto, fetch, discover, check]
        default: delta
      limit:
        description: 'Cap for map/harvest/fallback/discover (blank = mode default)'
        type: string
        default: ''
      tradition:
        description: 'discover: restrict to one tradition (blank = all)'
        type: string
        default: ''
  push:
    branches: ['**']
    paths:
      - 'data-sources/image-run.json'
      - 'data-sources/image-request.json'
      - 'data-sources/image-approved.json'
  schedule:
    - cron: '23 5 2 * *'   # monthly, day 2 05:23 UTC

# The job commits the fetched images back to the branch it ran on.
permissions:
  contents: write

concurrency:
  group: ingest-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # mode resolution diffs HEAD^..HEAD on push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # sharp converts the Commons-sized thumbnails to WebP so committed
      # portraits are small. The script treats it as optional (falls back to
      # the original bytes); here we install it so committed output is optimized.
      - name: Install sharp (WebP optimization)
        run: npm install --no-save sharp

      # Which mode? Dispatch says explicitly; cron means check+delta; a push
      # is resolved from WHICH trigger file changed (image-run.json names its
      # mode and wins when several changed together).
      - name: Resolve mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            echo "mode=cron" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD^ HEAD || true)
            if grep -q 'data-sources/image-run.json' <<<"$CHANGED"; then
              MODE=$(node -p 'try { require("./data-sources/image-run.json").mode || "delta" } catch (e) { "delta" }')
              echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            elif grep -q 'data-sources/image-approved.json' <<<"$CHANGED"; then
              echo "mode=approved" >> "$GITHUB_OUTPUT"
            else
              echo "mode=auto" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=${INPUT_MODE:-delta}" >> "$GITHUB_OUTPUT"
          fi

      # Inputs pass through env, never interpolated into the shell, so a
      # dispatch value can't inject commands.
      - name: Run ingest
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          LIMIT: ${{ inputs.limit }}
          TRAD: ${{ inputs.tradition }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${LIMIT:-}" ]; then ARGS+=(--limit "$LIMIT"); fi
          if [ -n "${TRAD:-}" ]; then ARGS+=(--trad "$TRAD"); fi
          if [ "$MODE" = "cron" ]; then
            node scripts/ingest-images.cjs check || true   # drift is reported, not a reason to skip the sweep
            node scripts/ingest-images.cjs delta
          else
            node scripts/ingest-images.cjs "$MODE" "${ARGS[@]}"
          fi

      - name: Commit results
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage whole dirs (git add of a non-existent pathspec aborts the
          # command and stages nothing). data-sources always exists; assets
          # only after a successful fetch.
          git add -A data-sources
          [ -d assets ] && git add -A assets || true
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Ingest PD/CC0 Commons images ($MODE)"
            git push origin "HEAD:$BRANCH"
          fi
