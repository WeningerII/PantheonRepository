name: Ingest Commons images

# Fetch PD / PD-old / PD-art / CC0 figure portraits from Wikimedia Commons
# (docs/image-licensing.md — the owner-set HARD RULE) and commit the optimized,
# self-hosted results. This lives in CI, not the build, because Commons is
# unreachable from the build sandbox and because ingest needs network + sharp.
# The running site only ever reads the committed, license-verified output.
#
# Two ways to run it:
#
#   • Edit data-sources/image-request.json (a JSON array of figure ids) and push.
#     CI runs `auto`: for each id it searches Commons, keeps only PD/CC0 hits,
#     fetches the top one, optimizes to WebP, self-hosts it, and commits the
#     result back to the branch. Zero filename lookup — good for "just get me a
#     portrait for X". Swap the chosen File: in image-sources.json + re-run to
#     override the pick.
#
#   • Run it from the Actions tab (workflow_dispatch) with a mode:
#       fetch    — download every curated "File:…" in image-sources.json.
#       discover — propose PD/CC0 candidates → image-candidates.json (no fetch).
#       check    — re-verify committed licenses still pass (fails on drift).
#     (Dispatch needs this workflow on the default branch; the push path above
#     works from any branch.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [fetch, discover, check]
        default: fetch
      limit:
        description: 'discover: max figures to probe (blank = all)'
        type: string
        default: ''
      tradition:
        description: 'discover: restrict to one tradition (blank = all)'
        type: string
        default: ''
  push:
    branches: ['**']
    paths:
      - 'data-sources/image-request.json'

# The job commits the fetched images back to the branch it ran on.
permissions:
  contents: write

concurrency:
  group: ingest-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # sharp converts the Commons-sized thumbnails to WebP so committed
      # portraits are small. The script treats it as optional (falls back to the
      # original bytes); here we install it so the committed output is optimized.
      - name: Install sharp (WebP optimization)
        run: npm install --no-save sharp

      # A push (image-request.json changed) means auto-ingest; a manual dispatch
      # uses the chosen mode.
      - name: Resolve mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${INPUT_MODE:-fetch}" >> "$GITHUB_OUTPUT"
          fi

      # Inputs pass through env, never interpolated into the shell, so a
      # dispatch value can't inject commands.
      - name: Run ingest
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          LIMIT: ${{ inputs.limit }}
          TRAD: ${{ inputs.tradition }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${LIMIT:-}" ]; then ARGS+=(--limit "$LIMIT"); fi
          if [ -n "${TRAD:-}" ]; then ARGS+=(--trad "$TRAD"); fi
          node scripts/ingest-images.cjs "$MODE" "${ARGS[@]}"

      # Never publish an image whose license drifted. auto/fetch re-verify each
      # file at download; this also catches a previously-committed image whose
      # Commons license changed since it was ingested.
      - name: Re-verify licenses
        if: ${{ steps.mode.outputs.mode == 'fetch' || steps.mode.outputs.mode == 'auto' }}
        run: node scripts/ingest-images.cjs check

      - name: Commit results
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/images \
                  data-sources/images.json \
                  data-sources/image-sources.json \
                  data-sources/image-candidates.json \
                  data-sources/image-rejects.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Ingest PD/CC0 Commons images ($MODE)"
            git push origin "HEAD:$BRANCH"
          fi
