name: CI

# Verify the artifact builds and the test suite passes on every push and PR.
on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Raised from 15 to cover the Chromium download and the cold-load probe.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      # Browse mounts rows on demand. If that regresses to mounting the whole
      # corpus, Lighthouse's Accessibility gatherer (one CDP evaluate under a
      # hard 60s cap) times out and nulls the Accessibility AND SEO categories
      # — a silent, score-destroying failure no unit test can see. jsdom cannot
      # observe it either: there is no layout and the reveal short-circuits to
      # mount everything. It needs a real browser.
      - name: Install Chromium for the cold-load probe
        run: npx playwright@1.49.1 install chromium

      - name: Verify cold-load and demand-reveal stability
        run: node scripts/verify-coldload.cjs

      # The MCP connector (mcp/) has its own deps and query engine that the
      # main suite doesn't touch; exercise its smoke suite (real-question
      # assertions over search/graph/registry/vocab) so the tools the
      # connector serves can't silently regress.
      - name: MCP connector smoke test
        run: |
          cd mcp
          npm ci --no-audit --no-fund
          npm run smoke

      # Goal 2 — the committed corpus must reproduce byte-for-byte from the
      # committed data-sources/ via the generators + build (no hand-edited
      # blob). This rebuilds dist/pantheon-registry.html itself, so a
      # standalone build step would be redundant.
      - name: Verify byte-exact regeneration
        run: bash scripts/verify-regen.sh
