name: Materialize verified artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-shiva.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/shiva-network'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Reproduce and verify exact artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-shiva-counterparts.cjs
          test "$(git hash-object app/data.js)" = "839ea829ef2a7233f5760c2a3d422941fa9d41b7"
          test "$(git hash-object dist/pantheon-registry.html)" = "ed1165534c6368c5689fc7a223db0f39a72444df"
          test "$(git hash-object data-sources/audits/shiva-counterparts/ledger.json)" = "27a3814bf0738c4e3e866fa0d6f5aff4ca57123c"
          git add -- app/data.js dist/pantheon-registry.html data-sources/audits/shiva-counterparts/ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize hash-verified artifacts"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/codex/shiva-network | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/codex/shiva-network
