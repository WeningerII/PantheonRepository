name: Materialize verified counterpart artifacts
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/materialize-sakra-indra.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/sakra-indra-network'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Reproduce locally verified source and build hashes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/gen-new-figures.cjs
          node scripts/gen-enrich.cjs
          node scripts/gen-powers-terms.cjs
          node scripts/gen-powers-items.cjs
          python3 build.py
          node scripts/audit-sakra-indra.cjs
          node scripts/audit-shiva-counterparts.cjs
          test "$(git hash-object app/data.js)" = "921501c140d103b590c86b6322510f71eab833a5"
          test "$(git hash-object dist/pantheon-registry.html)" = "c11265e635aa5369206de10eadd67a742f66431f"
          test "$(git hash-object data-sources/audits/sakra-indra/ledger.json)" = "6244d2280a3fded5e8b7484bb32ba9adbd9957d0"
          test "$(git hash-object data-sources/audits/shiva-counterparts/ledger.json)" = "1930c91b64d0d93ed4b19f0a651fb038b0bb16f6"
          git add -- app/data.js dist/pantheon-registry.html data-sources/audits/sakra-indra/ledger.json data-sources/audits/shiva-counterparts/ledger.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize verified counterpart corpus and standalone artifact"
          bash scripts/verify-regen.sh
          test "$(git ls-remote origin refs/heads/feat/sakra-indra-network | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/sakra-indra-network
